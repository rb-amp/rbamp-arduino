name=RbAmp
version=1.0.0
author=rbAmp team
maintainer=rbAmp Project <dev@rbamp.local>
sentence=Arduino client library for the rbAmp I2C AC sensor / dimmer module. Reads RMS U / I / P / PF / frequency from a single I2C device; integrates energy on the master.
paragraph=Read RMS voltage, current, real power, power factor, and frequency. Per-period energy (Wh) integration with master-side wall-clock. Multi-module sync via I2C General-Call broadcast LATCH. Supports UI1/UI2/UI3/I1/I2/I3 SKUs with automatic variant detection. Conforms to the cross-platform rbAmp protocol spec — drop-in compatible naming with the STM32 HAL, ESP-IDF, MicroPython and CPython libraries.
category=Sensors
url=https://github.com/rb-amp/rbamp-arduino
