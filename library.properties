sentence=Arduino client library for the rbAmp I2C AC sensor / dimmer module. Reads RMS U / I / P / PF / frequency from a single I2C device; integrates energy on the master.
paragraph=Read RMS voltage, current, real power, power factor, and frequency. Per-period energy (Wh) integration on the master's wall-clock. Per-channel current-sensor configuration. The RbAmpFleet manager handles several modules on one bus: scan, batched poll, fleet-wide aggregation, and simultaneous period latching via I2C General-Call, plus provisioning and two-phase address assignment. Supports both product lines (BASIC 8-bit and STD 16-bit register models, including three-phase modules) with automatic line, variant and channel-count detection. Conforms to the cross-platform rbAmp protocol spec — drop-in compatible naming with the STM32 HAL, ESP-IDF, MicroPython and CPython libraries.
category=Sensors
